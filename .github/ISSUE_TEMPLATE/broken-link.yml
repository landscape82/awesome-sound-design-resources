name: Report a broken link or wrong info
description: Report a dead link, a wrong price/platform marker or an outdated description.
title: "Fix: <resource name>"
labels: [broken-link]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Entry URL
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What's wrong?
      options:
        - Page not found / site down
        - Redirects somewhere unrelated
        - Project discontinued or archived
        - Wrong price/platform marker
        - Description outdated or incorrect
        - Other
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Suggested replacement link
      description: Optional - e.g. the project's new home or GitHub repo.
      placeholder: https://
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For wrong markers or descriptions, describe what the entry should say.
