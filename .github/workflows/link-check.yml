name: Weekly Link Check

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    outputs:
      broken: ${{ steps.link-check.outputs.broken }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: npm ci

      - name: Check links
        id: link-check
        run: |
          set +e
          npx markdown-link-check README.md --config .markdown-link-check.json --verbose > link-check-output.txt 2>&1
          status=$?
          set -e
          # --verbose prints every failing link twice (inline, then again in the
          # end-of-file summary), so dedupe by URL - keeping the first, more
          # detailed line - before counting.
          { grep -E '^[[:space:]]*\[✖\]' link-check-output.txt || true; } \
            | awk -F ' → ' '!seen[$1]++' > broken-links.txt
          broken=$(wc -l < broken-links.txt | tr -d ' ')
          echo "broken=${broken:-0}" >> "$GITHUB_OUTPUT"
          # A non-zero exit with no broken links means the tool itself errored
          # (bad config, network problem) rather than finding dead links -
          # that's a real CI failure, not routine link rot.
          if [ "$status" -ne 0 ] && [ "${broken:-0}" -eq 0 ]; then
            exit "$status"
          fi
          exit 0

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🔗 Weekly Link Check — README.md"
            echo ""
            if [ -f link-check-output.txt ]; then
              total=$({ grep -E '^[[:space:]]*\[[✓✖]\]' link-check-output.txt || true; } \
                | sed -E 's/^[[:space:]]*\[[✓✖]\][[:space:]]*//; s/[[:space:]]→.*$//' | sort -u | wc -l | tr -d ' ')
              broken=$(wc -l < broken-links.txt 2>/dev/null | tr -d ' ' || true)
              total=${total:-0}
              broken=${broken:-0}
              ok=$((total - broken))
              echo "**${ok}/${total} links OK**, **${broken} broken**."
              echo ""
              if [ "$broken" -gt 0 ]; then
                echo "### Broken links"
                echo ""
                echo "| URL | Status |"
                echo "| --- | --- |"
                sed -E 's/^[[:space:]]*\[✖\][[:space:]]*(.*)[[:space:]]→[[:space:]]Status:[[:space:]]*(.*)$/| \1 | \2 |/' broken-links.txt
                echo ""
                echo "Fix or replace these in \`README.md\`, or, if a link is a known false positive, add it to \`.markdown-link-check.json\`'s \`ignorePatterns\`."
              else
                echo "All links resolved successfully. ✅"
              fi
            else
              echo "⚠️ The link-check step did not produce output — see the job log for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Replaces JasonEtco/create-an-issue@v2: that action has no Node 24 build
      # (latest release v2.9.2), so it kept tripping the runner's Node 20
      # deprecation warning. gh is preinstalled on GitHub-hosted runners, so
      # this does the same "open or update a tracking issue" job natively.
      - name: Open or update issue on broken links
        if: steps.link-check.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Broken link(s) found in README"
          BODY="The weekly link-check workflow found one or more broken links in \`README.md\`.

          **Workflow run:** ${RUN_URL}

          See the job summary on that run for the full list of broken links, then either:
          - fix/replace the link in \`README.md\`, or
          - remove the entry if the project is no longer available, or
          - close this issue if the failure was a false positive (e.g. the site blocks bots) and add it to \`.markdown-link-check.json\`'s \`ignorePatterns\` if it will keep recurring."

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label broken-link
          fi

      - name: Close tracking issue when all links pass
        if: steps.link-check.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Broken link(s) found in README"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --comment "All links passed in ${RUN_URL} - closing automatically."
          fi

      # The link-check step is informational, not blocking: a large curated
      # list will always have some link rot, and the step above already
      # files/updates a tracking issue for it.
      - name: Surface result
        if: steps.link-check.outputs.broken != '0'
        run: echo "::warning::Broken links found - see the job summary above, tracked in the broken-link issue."

  # Separate job so it can share the "repo-sync" concurrency group with
  # readme-sync.yml without queueing the whole (slow) link check behind it.
  # Publishes through the same rolling bot branch/PR - see .github/scripts/bot-sync.sh.
  badge:
    needs: link-check
    if: always() && needs.link-check.outputs.broken != ''
    runs-on: ubuntu-latest
    concurrency:
      group: repo-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out bot branch
        run: .github/scripts/bot-sync.sh checkout

      - name: Generate broken-links badge
        env:
          BROKEN: ${{ needs.link-check.outputs.broken }}
        run: |
          set -euo pipefail
          color="brightgreen"
          if [ "$BROKEN" -gt 0 ]; then color="red"; fi
          cat > .github/badges/broken-links.json <<EOF
          {"schemaVersion":1,"label":"broken links","message":"${BROKEN}","color":"${color}"}
          EOF

      - name: Open or update bot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/bot-sync.sh publish "chore: update broken-links badge"
