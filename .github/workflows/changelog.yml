name: Update Changelog

on:
  push:
    branches: [main]
    paths:
      - "README.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract added entries and update CHANGELOG.md
        run: |
          set -euo pipefail

          # Lines added to README.md by this push that look like list entries.
          ADDED=$(git diff "${{ github.event.before }}" "${{ github.sha }}" -- README.md \
            | grep -E '^\+- \*\*\[' \
            | sed 's/^\+//' || true)

          if [ -z "$ADDED" ]; then
            echo "No new resource entries added, skipping changelog update."
            exit 0
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          BLOCK=$(printf '## %s\n\nCommit: %s\n\n%s\n' "$TIMESTAMP" "$COMMIT_URL" "$ADDED")

          awk -v block="$BLOCK" '
            /<!-- changelog-entries-start -->/ { print; print block; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      # main is protected (requires a PR + passing "lint" check), so this
      # can't push directly - it opens a small bot PR and auto-merges it
      # instead, once the change actually differs from what's on main.
      - name: Open PR for changelog update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/changelog-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update changelog"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: update changelog" \
            --body "Automated update from the \`changelog\` workflow."
          gh pr merge "$BRANCH" --auto --squash --delete-branch
