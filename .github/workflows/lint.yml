name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: npm ci

      - name: Run markdownlint
        run: npx markdownlint README.md CONTRIBUTING.md --config .markdownlint.json

      # Informational only: awesome-lint enforces the strict sindresorhus/awesome
      # format (no bold links, specific GitHub topics, etc). This list has used
      # bold **[Name](url)** entries since its first commit; full compliance would
      # mean reformatting every entry, which is a deliberate style choice, not a bug.
      - name: Run awesome-lint (non-blocking)
        continue-on-error: true
        run: npx awesome-lint
