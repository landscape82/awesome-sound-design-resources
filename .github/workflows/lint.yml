name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: npm ci

      - name: Run markdownlint
        run: npx markdownlint README.md CONTRIBUTING.md --config .markdownlint.json

      - name: Run awesome-lint (non-blocking)
        continue-on-error: true
        run: npx awesome-lint
